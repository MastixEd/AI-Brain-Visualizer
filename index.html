<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Brain Visualizer - Interactive Variables</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050510; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 10; pointer-events: none; display: flex; padding: 2rem; box-sizing: border-box; }
        .interactive { pointer-events: auto; }
        .glass-panel { background: rgba(10, 15, 30, 0.85); backdrop-filter: blur(10px); border: 1px solid rgba(0, 255, 255, 0.2); border-radius: 1rem; box-shadow: 0 0 20px rgba(0, 255, 255, 0.1); }
        .glow-text { text-shadow: 0 0 10px rgba(0, 255, 255, 0.8); }
        .hidden-pulse { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 0.7; } 50% { opacity: 1; text-shadow: 0 0 15px #a855f7; } 100% { opacity: 0.7; } }
        /* Custom scrollbar for input area if it gets too tall */
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        .custom-scroll::-webkit-scrollbar-thumb { background: rgba(0, 255, 255, 0.4); border-radius: 3px; }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="ui-layer" class="flex-col md:flex-row justify-between items-start gap-6">
        
        <!-- Left Panel: Controls & Scenario -->
        <div class="glass-panel p-6 w-full md:w-1/3 max-h-full overflow-y-auto custom-scroll flex flex-col gap-4 interactive">
            <h1 class="text-3xl font-bold glow-text text-cyan-400 border-b border-cyan-800 pb-2">AI Brain Visualizer</h1>
            <p class="text-gray-300 text-sm">Change the input variables and see how the AI changes its prediction!</p>
            
            <div class="mt-2">
                <label class="block text-cyan-300 mb-2 font-semibold">Select AI Mission:</label>
                <select id="scenario-select" class="w-full bg-slate-800 text-white border border-cyan-600 rounded p-2 focus:outline-none focus:border-cyan-400">
                    <option value="plants">🌿 Plant Health Monitor</option>
                    <option value="weather">⛅ Weather Predictor</option>
                    <option value="animals">🐾 Animal Identifier</option>
                    <option value="books">📚 Book Recommender</option>
                </select>
            </div>

            <div class="mt-4 flex flex-col gap-3">
                <div class="p-3 bg-slate-800/50 rounded border-l-4 border-red-500">
                    <div class="flex justify-between items-center mb-2">
                        <h3 class="font-bold text-red-400">Input Layer (Sensors)</h3>
                        <span class="text-xs bg-red-900/50 text-red-200 px-2 py-1 rounded">Interactive</span>
                    </div>
                    <!-- Dynamic Interactive Inputs Will Render Here -->
                    <div id="dynamic-inputs" class="flex flex-col gap-2"></div>
                </div>
                
                <div class="p-3 bg-slate-800/50 rounded border-l-4 border-purple-500">
                    <h3 class="font-bold text-purple-400">Hidden Layer (Processing)</h3>
                    <p id="ui-hidden" class="text-sm text-gray-300 mt-1">Analyzing data patterns...</p>
                </div>

                <div class="p-3 bg-slate-800/50 rounded border-l-4 border-green-500">
                    <h3 class="font-bold text-green-400">Output Layer (Prediction)</h3>
                    <p id="ui-output" class="text-xl font-bold text-white mt-2 min-h-[2rem]">Waiting for data...</p>
                </div>
            </div>

            <button id="run-btn" class="mt-2 w-full bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-3 px-4 rounded transition-colors shadow-[0_0_15px_rgba(0,255,255,0.4)]">
                🚀 SEND DATA TO AI BRAIN
            </button>
        </div>

        <!-- Right Panel: Audio & Legend -->
        <div class="flex flex-col gap-4 interactive items-end w-full md:w-auto">
            <button id="sound-btn" class="glass-panel p-3 text-cyan-400 hover:text-white hover:bg-cyan-900 transition-colors rounded-full flex items-center gap-2">
                <span id="sound-icon">🔈</span> Sound: OFF
            </button>
            
            <div class="glass-panel p-4 text-sm text-gray-300">
                <h4 class="font-bold text-white mb-2 border-b border-gray-600 pb-1">Network Legend</h4>
                <div class="flex items-center gap-2 mb-1"><span class="w-3 h-3 rounded-full bg-red-500 inline-block shadow-[0_0_8px_red]"></span> Interactive Inputs</div>
                <div class="flex items-center gap-2 mb-1"><span class="w-3 h-3 rounded-full bg-purple-500 inline-block shadow-[0_0_8px_purple]"></span> Hidden Nodes</div>
                <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-green-500 inline-block shadow-[0_0_8px_green]"></span> Final Output</div>
            </div>
        </div>
    </div>

    <script>
        // --- INTERACTIVE DATA SCENARIOS ---
        const scenarios = {
            plants: {
                hidden: "Analyzing moisture levels, light exposure, and leaf conditions...",
                inputs: [
                    { id: 'moisture', label: 'Soil Moisture', options: ['Dry', 'Perfect', 'Flooded'] },
                    { id: 'sunlight', label: 'Sunlight', options: ['Too Little', 'Perfect', 'Too Much'] },
                    { id: 'bugs', label: 'Pest Presence', options: ['None', 'Many Bugs'] }
                ],
                getOutput: (state) => {
                    if (state.moisture === 'Dry') return "🥀 Sick - Add Water!";
                    if (state.moisture === 'Flooded') return "🍂 Sick - Too Much Water!";
                    if (state.bugs === 'Many Bugs') return "🐛 Sick - Needs Bug Spray!";
                    if (state.sunlight !== 'Perfect') return "🌱 Surviving, but adjust sunlight.";
                    return "🌿 Healthy, Thriving Plant!";
                }
            },
            weather: {
                hidden: "Calculating atmospheric pressure, temperature, and humidity...",
                inputs: [
                    { id: 'clouds', label: 'Cloud Cover', options: ['Clear Sky', 'Dark Clouds'] },
                    { id: 'temp', label: 'Temperature', options: ['Freezing', 'Warm', 'Hot'] },
                    { id: 'humidity', label: 'Humidity', options: ['Low', 'High'] }
                ],
                getOutput: (state) => {
                    if (state.clouds === 'Dark Clouds' && state.temp === 'Freezing') return "🌨️ Heavy Snowstorm!";
                    if (state.clouds === 'Dark Clouds' && state.humidity === 'High') return "⛈️ Thunderstorm!";
                    if (state.clouds === 'Dark Clouds' && state.humidity === 'Low') return "☁️ Overcast & Gloomy";
                    if (state.temp === 'Hot' && state.humidity === 'Low') return "🏜️ Heatwave - Stay Hydrated!";
                    return "☀️ Beautiful Sunny Day!";
                }
            },
            animals: {
                hidden: "Matching biological features and habitats in the database...",
                inputs: [
                    { id: 'diet', label: 'Diet', options: ['Meat', 'Plants'] },
                    { id: 'habitat', label: 'Habitat', options: ['House', 'Jungle', 'Ocean'] },
                    { id: 'legs', label: 'Number of Legs', options: ['0', '2', '4'] }
                ],
                getOutput: (state) => {
                    if (state.habitat === 'Ocean') return state.diet === 'Meat' ? "🦈 Shark" : "🐢 Sea Turtle";
                    if (state.habitat === 'House' && state.legs === '4') return state.diet === 'Meat' ? "🐱 House Cat" : "🐹 Guinea Pig";
                    if (state.habitat === 'House' && state.legs === '2') return "🦜 Pet Parrot";
                    if (state.habitat === 'Jungle' && state.legs === '4') return state.diet === 'Meat' ? "🐅 Tiger" : "🐘 Elephant";
                    if (state.habitat === 'Jungle' && state.legs === '0') return "🐍 Python Snake";
                    return "🐒 Unknown Species Found!";
                }
            },
            books: {
                hidden: "Matching user profile with genre characteristics and pacing...",
                inputs: [
                    { id: 'vibe', label: 'Desired Vibe', options: ['Action-Packed', 'Relaxing', 'Scary'] },
                    { id: 'setting', label: 'Setting', options: ['Outer Space', 'Magical Realm', 'Real World'] },
                    { id: 'length', label: 'Book Length', options: ['Short Story', 'Epic Novel'] }
                ],
                getOutput: (state) => {
                    if (state.vibe === 'Scary' && state.setting === 'Outer Space') return "👽 Sci-Fi Horror";
                    if (state.vibe === 'Scary' && state.setting === 'Real World') return "🕵️ True Crime Thriller";
                    if (state.vibe === 'Action-Packed' && state.setting === 'Magical Realm') return "⚔️ Epic Fantasy Battle";
                    if (state.vibe === 'Relaxing' && state.setting === 'Magical Realm') return "🧚 Cozy Fairy Tale";
                    if (state.setting === 'Outer Space') return "🚀 Space Exploration Journey";
                    return "📚 General Fiction";
                }
            }
        };

        // --- AUDIO SYSTEM ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        let isAudioEnabled = false;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playBeep(freq, type, duration, vol = 0.1) {
            if (!isAudioEnabled || !audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(freq * 0.5, audioCtx.currentTime + duration);
            
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function playProcessSound() {
            if (!isAudioEnabled || !audioCtx) return;
            for(let i=0; i<6; i++) {
                setTimeout(() => playBeep(300 + Math.random()*500, 'square', 0.1, 0.05), i * 120);
            }
        }

        function playSuccessSound() {
            if (!isAudioEnabled || !audioCtx) return;
            setTimeout(() => playBeep(500, 'sine', 0.2, 0.1), 0);
            setTimeout(() => playBeep(700, 'sine', 0.3, 0.1), 150);
            setTimeout(() => playBeep(1000, 'sine', 0.5, 0.1), 300);
        }

        // --- UI INTERACTION ---
        const scenarioSelect = document.getElementById('scenario-select');
        const dynamicInputsContainer = document.getElementById('dynamic-inputs');
        const uiHidden = document.getElementById('ui-hidden');
        const uiOutput = document.getElementById('ui-output');
        const runBtn = document.getElementById('run-btn');
        const soundBtn = document.getElementById('sound-btn');
        let currentScenario = 'plants';
        let finalResultToDisplay = "";

        soundBtn.addEventListener('click', () => {
            isAudioEnabled = !isAudioEnabled;
            if (isAudioEnabled) initAudio();
            soundBtn.innerHTML = isAudioEnabled ? '🔊 Sound: ON' : '🔈 Sound: OFF';
            soundBtn.classList.toggle('text-white', isAudioEnabled);
            soundBtn.classList.toggle('bg-cyan-900', isAudioEnabled);
        });

        function buildInputUI() {
            const scenario = scenarios[currentScenario];
            dynamicInputsContainer.innerHTML = '';
            
            scenario.inputs.forEach((inp, idx) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'flex justify-between items-center bg-slate-900/50 p-2 rounded';
                
                const label = document.createElement('label');
                label.className = 'text-sm text-cyan-100 flex-1';
                label.innerText = inp.label;
                
                const select = document.createElement('select');
                select.id = `input-${inp.id}`;
                select.className = 'bg-slate-700 text-white text-sm border border-cyan-700 rounded p-1 ml-2 flex-1 focus:outline-none focus:border-cyan-400 interactive';
                
                inp.options.forEach(opt => {
                    const option = document.createElement('option');
                    option.value = opt;
                    option.innerText = opt;
                    select.appendChild(option);
                });
                
                // Reset output text if user changes a variable to encourage re-running
                select.addEventListener('change', () => {
                    if(!isAnimating) uiOutput.innerText = "Data changed. Click SEND DATA!";
                });

                wrapper.appendChild(label);
                wrapper.appendChild(select);
                dynamicInputsContainer.appendChild(wrapper);
            });

            uiHidden.innerText = scenario.hidden;
            uiOutput.innerText = 'Waiting for data...';
            uiHidden.classList.remove('hidden-pulse');
        }

        scenarioSelect.addEventListener('change', (e) => {
            currentScenario = e.target.value;
            buildInputUI();
        });

        // --- THREE.JS SCENE SETUP ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050510, 0.02);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 30);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);
        const pointLight = new THREE.PointLight(0x00ffff, 2, 50);
        pointLight.position.set(0, 0, 10);
        scene.add(pointLight);

        // --- NEURAL NETWORK GENERATION ---
        const nodes = [];
        const edges = [];
        const layerPositions = [-12, 0, 12]; 
        const nodeColors = [0xff3333, 0xa855f7, 0x22c55e]; 
        const layerCounts = [3, 5, 3]; 

        const nodeGeometry = new THREE.SphereGeometry(0.8, 32, 32);
        
        for (let l = 0; l < layerCounts.length; l++) {
            const count = layerCounts[l];
            const startY = (count - 1) * 3 / 2;
            for (let i = 0; i < count; i++) {
                const material = new THREE.MeshPhysicalMaterial({ 
                    color: nodeColors[l],
                    emissive: nodeColors[l],
                    emissiveIntensity: 0.5,
                    transparent: true,
                    opacity: 0.9,
                    roughness: 0.2,
                    metalness: 0.8
                });
                const node = new THREE.Mesh(nodeGeometry, material);
                node.position.set(layerPositions[l], startY - (i * 3), 0);
                node.userData = { layer: l, index: i, originalEmissive: 0.5 };
                scene.add(node);
                nodes.push(node);
            }
        }

        const lineMaterial = new THREE.LineBasicMaterial({ color: 0x444466, transparent: true, opacity: 0.3 });
        
        for (let i = 0; i < nodes.length; i++) {
            const nodeA = nodes[i];
            if (nodeA.userData.layer === 2) continue;
            for (let j = 0; j < nodes.length; j++) {
                const nodeB = nodes[j];
                if (nodeB.userData.layer === nodeA.userData.layer + 1) {
                    const geometry = new THREE.BufferGeometry().setFromPoints([nodeA.position, nodeB.position]);
                    const line = new THREE.Line(geometry, lineMaterial);
                    scene.add(line);
                    edges.push({ start: nodeA.position, end: nodeB.position });
                }
            }
        }

        const pulseGeometry = new THREE.SphereGeometry(0.3, 16, 16);
        const pulseMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff });

        // --- ANIMATION LOGIC ---
        let isAnimating = false;
        let animationStage = 0; 
        let animationProgress = 0;
        let activePulses = [];

        runBtn.addEventListener('click', () => {
            if (isAnimating) return;
            
            // Gather state from current selects
            const scenario = scenarios[currentScenario];
            const currentState = {};
            scenario.inputs.forEach(inp => {
                const selectElement = document.getElementById(`input-${inp.id}`);
                if(selectElement) currentState[inp.id] = selectElement.value;
            });
            
            // Calculate outcome instantly, but display it after animation
            finalResultToDisplay = scenario.getOutput(currentState);

            isAnimating = true;
            animationStage = 1;
            animationProgress = 0;
            uiOutput.innerText = 'Processing Variables...';
            uiHidden.classList.add('hidden-pulse');
            runBtn.disabled = true;
            runBtn.classList.add('opacity-50');

            playBeep(300, 'triangle', 0.2, 0.1);

            activePulses = [];
            edges.forEach(edge => {
                if (edge.start.x === layerPositions[0]) {
                    const pulse = new THREE.Mesh(pulseGeometry, pulseMaterial);
                    pulse.position.copy(edge.start);
                    scene.add(pulse);
                    activePulses.push({ mesh: pulse, start: edge.start, end: edge.end });
                }
            });
        });

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const time = clock.getElapsedTime();

            camera.position.x = Math.sin(time * 0.2) * 2;
            camera.position.y = Math.cos(time * 0.1) * 2;
            camera.lookAt(0, 0, 0);

            nodes.forEach(node => {
                const wave = Math.sin(time * 2 + node.position.y) * 0.2;
                node.material.emissiveIntensity = node.userData.originalEmissive + wave;
            });

            if (isAnimating) {
                if (animationStage === 1 || animationStage === 3) {
                    animationProgress += delta * 1.5; 

                    activePulses.forEach(p => {
                        p.mesh.position.lerpVectors(p.start, p.end, animationProgress);
                    });

                    if (animationProgress >= 1) {
                        activePulses.forEach(p => scene.remove(p.mesh));
                        activePulses = [];
                        
                        if (animationStage === 1) {
                            animationStage = 2; 
                            playProcessSound();
                            nodes.filter(n => n.userData.layer === 1).forEach(n => n.material.emissiveIntensity = 2.0);
                            
                            setTimeout(() => {
                                animationStage = 3;
                                animationProgress = 0;
                                edges.forEach(edge => {
                                    if (edge.start.x === layerPositions[1]) {
                                        const pulse = new THREE.Mesh(pulseGeometry, pulseMaterial);
                                        pulse.position.copy(edge.start);
                                        scene.add(pulse);
                                        activePulses.push({ mesh: pulse, start: edge.start, end: edge.end });
                                    }
                                });
                            }, 1000); 
                        } else if (animationStage === 3) {
                            animationStage = 0;
                            isAnimating = false;
                            runBtn.disabled = false;
                            runBtn.classList.remove('opacity-50');
                            uiHidden.classList.remove('hidden-pulse');
                            
                            nodes.filter(n => n.userData.layer === 2).forEach(n => n.material.emissiveIntensity = 2.0);
                            playSuccessSound();

                            uiOutput.innerText = finalResultToDisplay;
                        }
                    }
                }
            }

            renderer.render(scene, camera);
        }

        buildInputUI();
        animate();
    </script>
</body>
</html>
